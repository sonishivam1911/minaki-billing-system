name: Deploy Billing Frontend to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-contabo-billing-frontend
  # Never interrupt a deploy midway through the Vite build.
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runner living on the Contabo VPS itself, so there is no SSH
    # hop and no deploy key to manage. See minaki-deployment/scripts/setup-github-actions-runner.sh
    #
    # This repository is public, so the trigger is deliberately limited to
    # pushes on main (which require write access). Do not add pull_request or
    # pull_request_target triggers here — that would let any fork run code on
    # the production VPS.
    runs-on: [self-hosted, contabo]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GitHub repository variables
        run: |
          test -n "${{ vars.INFISICAL_IDENTITY_ID }}" || {
            echo "Missing repo variable: INFISICAL_IDENTITY_ID"
            exit 1
          }
          test -n "${{ vars.INFISICAL_PROJECT_SLUG }}" || {
            echo "Missing repo variable: INFISICAL_PROJECT_SLUG"
            exit 1
          }

      - name: Fetch build secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          domain: https://secrets.minaki.me
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          oidc-audience: https://github.com/sonishivam1911
          env-slug: prod
          secret-path: /
          export-type: env

      - name: Write production env for Vite build
        run: |
          : > .env.production
          env | grep '^VITE_' >> .env.production || true
          test -s .env.production || {
            echo "No VITE_* secrets found in Infisical prod /"
            exit 1
          }
          chmod 600 .env.production
          echo "Baked $(wc -l < .env.production) VITE_* variables into the build"

      - name: Deploy and health check
        run: |
          sudo -n /root/homelab/scripts/ci-deploy.sh \
            minaki-billing \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/.env.production"

      - name: Remove exported secrets from the runner
        if: always()
        run: rm -f .env.production
